name: API_Deployment_on_EC2
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Push to EC2 Instance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      # Refuse the deploy while a COMMODITY (MCX) paper page is running — MCX
      # trades until ~23:30, well after the NSE close when pushes are allowed,
      # and a PM2 restart mid-session would interrupt it. Runs BEFORE the sync,
      # so a refused deploy leaves the box untouched. Each running page keeps a
      # ~/trading-data/cmx/.running_<page>.json stamped with today's IST date and
      # deletes it when it stops. To deploy: stop the commodity pages (or wait
      # until 23:45 IST), then re-run this workflow.
      - name: Refuse deploy while commodity paper is running
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            TODAY=$(TZ=Asia/Kolkata date +%F)
            NOW=$((10#$(TZ=Asia/Kolkata date +%H%M)))
            RUNNING=$(grep -l "\"day\": \"$TODAY\"" ~/trading-data/cmx/.running_*.json 2>/dev/null | sed 's#.*/.running_##; s#.json$##' | tr '\n' ' ')
            if [ -n "$RUNNING" ] && [ "$NOW" -lt 2345 ]; then
              echo "DEPLOY REFUSED: commodity paper running on EC2: $RUNNING"
              echo "Stop those pages (or wait until 23:45 IST), then re-run this workflow."
              exit 1
            fi
            echo "no commodity paper running - deploy allowed"

      - name: Sync files to EC2
        uses: easingthemes/ssh-deploy@v4.1.9
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.HOST_DNS }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          TARGET: "/var/www/html/trade/"
          # .git/ is a fresh packfile on every run, so rsync can never delta it
          # — several MB re-sent each deploy for a directory nothing on the box
          # reads (deploys are rsync-based, not `git pull`).
          EXCLUDE: ".env, node_modules/, .git/"

      - name: Install deps & restart app via PM2
        # Pinned: @master re-downloaded the drone-ssh binary on every run.
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Fix npm prefix conflict that breaks nvm
            npm config delete prefix 2>/dev/null || true

            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh

            # Pin Node 16 — works on Amazon Linux 2 (GLIBC 2.17+)
            # Node 18/20 requires GLIBC 2.28 which Amazon Linux 2 does NOT have
            nvm use 16 2>/dev/null || (nvm install 16 && nvm use 16)
            nvm alias default 16

            cd /var/www/html/trade/

            # Only reinstall when the dependency tree actually changed. This box
            # is a t3.micro (2 burstable vCPU, ~950MB RAM) already running the
            # bot at a 900MB heap cap, so npm competes with it for RAM and CPU
            # credits and costs ~2 minutes — on every push, including the
            # src-only ones that are the overwhelming majority. The marker lives
            # inside node_modules so a wiped tree always forces a fresh install,
            # and is written only after a successful install so a failed one is
            # never cached as done.
            LOCK_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
            MARKER=node_modules/.deploy-lock-hash
            if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$LOCK_HASH" ]; then
              echo "deps unchanged (lock $LOCK_HASH) — skipping npm install"
            else
              npm install --omit=dev && echo "$LOCK_HASH" > "$MARKER"
            fi

            # Start or restart via ecosystem.config.js so the deploy ALWAYS
            # picks up the latest memory/heap caps, node_args, and env vars.
            # `pm2 reload trading-bot` (without the config file) reuses the
            # daemon's cached config, so ecosystem.config.js changes never
            # take effect until the process is deleted. Passing the config
            # file forces pm2 to re-read it.
            pm2 startOrRestart ecosystem.config.js --update-env

            pm2 save

            # Auto-start PM2 (and trading-bot) on server reboot. One-time setup,
            # so only pay for the sudo round-trip when the unit is missing.
            if systemctl list-unit-files 2>/dev/null | grep -q "^pm2-$USER\.service"; then
              echo "pm2 systemd unit already installed — skipping startup"
            else
              PM2_PATH=$(which pm2)
              sudo env PATH=$PATH:$(dirname $PM2_PATH) pm2 startup systemd -u $USER --hp $HOME
            fi